<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulce Bom - Recuperar Contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/style.css}">
</head>
<body>

<div id="authContainer">
    <div class="auth-card">
        <div class="auth-img" style="background-image: url('/assets/pedidos.jpg');"></div>
        <div class="auth-body">
            <h2>Recuperar Contraseña</h2>
            <p class="auth-sub">Gestión de Pastelería</p>

            <div id="msgError" class="alert alert-danger py-2 text-center small mb-3 d-none"></div>
            <div id="msgSuccess" class="alert alert-success py-2 text-center small mb-3 d-none"></div>

            <p class="text-muted small mb-3">
                Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <div class="mb-4">
                <label class="form-label">Email de la cuenta</label>
                <input type="email" id="recoverEmail" class="form-control"
                       placeholder="Ingresa tu email registrado" required/>
            </div>

            <button onclick="solicitarReset()" id="btnSolicitar"
                    class="btn btn-primary w-100 py-2 fw-bold">
                <i class="bi bi-envelope-fill me-2"></i>Enviar enlace por correo
            </button>

            <p class="auth-links text-center mt-3">
                <a th:href="@{/login}">← Volver al login</a>
            </p>
        </div>
    </div>
</div>

<script>
async function solicitarReset() {
    const email   = document.getElementById('recoverEmail').value.trim();
    const msgErr  = document.getElementById('msgError');
    const msgOk   = document.getElementById('msgSuccess');
    const btn     = document.getElementById('btnSolicitar');

    msgErr.classList.add('d-none');
    msgOk.classList.add('d-none');

    if (!email) {
        msgErr.textContent = 'Ingresa tu email.';
        msgErr.classList.remove('d-none'); return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Enviando...';

    try {
        const res = await fetch('/recuperar/solicitar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
            msgOk.textContent = data.message;
            msgOk.classList.remove('d-none');
            btn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>Correo enviado';
        } else {
            msgErr.textContent = data.message || 'Error al enviar.';
            msgErr.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-envelope-fill me-2"></i>Enviar enlace por correo';
        }
    } catch (e) {
        msgErr.textContent = 'Error de conexión con el servidor.';
        msgErr.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-envelope-fill me-2"></i>Enviar enlace por correo';
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
