spring.application.name=dulcebom

# Configuración de base de datos para PostgreSQL (Dinámica)
# Ya no necesitas poner username ni password aquí, Neon los incluye en la URL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate (Dialecto para PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Servidor y límites
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=dulcebom.sistema@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Configuración de Cloudinary
cloudinary.cloud-name=drmhaimrx
cloudinary.api-key=774925683788114
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# URL base
app.base-url=http://localhost:8080
