<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulce Bom - Gestión de Pastelería</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/style.css}">
</head>
<body>

<div id="authContainer">
    <div class="auth-card">

        <div class="auth-img" style="background-image: url('/assets/pedidos.jpg');"></div>

        <div class="auth-body">
            <h2 id="authTitle">Iniciar Sesión</h2>
            <p class="auth-sub">Gestión de Pastelería</p>

            <!-- Error de credenciales -->
            <div th:if="${param.error}" class="alert alert-danger py-2 text-center small mb-3">
                Usuario o contraseña incorrectos.
            </div>
            <!-- Logout exitoso -->
            <div th:if="${param.logout}" class="alert alert-success py-2 text-center small mb-3">
                Sesión cerrada correctamente.
            </div>

            <!-- LOGIN FORM -->
            <form th:action="@{/login}" method="post" id="loginForm">

                <div class="mb-3">
                    <label class="form-label">Usuario (Email)</label>
                    <input type="email"
                           name="username"
                           class="form-control"
                           required
                           placeholder="Ingrese su email"/>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           required
                           placeholder="Ingrese su contraseña"/>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                    Ingresar
                </button>

                <p class="auth-links">
                    <a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a>
                    <a th:href="@{/registro}">Regístrate aquí.</a>
                </p>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
