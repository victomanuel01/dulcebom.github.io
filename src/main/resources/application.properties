spring.application.name=dulcebom

# Base de datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto para Render/Railway
server.port=${PORT:8080}

# Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Correo
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=dulcebom.sistema@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Cloudinary
cloudinary.cloud-name=drmhaimrx
cloudinary.api-key=774925683788114
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# URL base
app.base-url=https://dulcebom-production.up.railway.app
