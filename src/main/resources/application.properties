spring.application.name=dulcebom

# Configuración de base de datos (dinámica)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Servidor y límites
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de Mail (dinámica para la contraseña)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=dulcebom.sistema@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Configuración de Cloudinary (dinámica para el secreto)
cloudinary.cloud-name=drmhaimrx
cloudinary.api-key=774925683788114
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# URL base
app.base-url=http://localhost:8080
